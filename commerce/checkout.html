<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Checkout — Kaarigar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="store.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23B4552F'/><path d='M28 72 V34 h10 v14 l16-14 h14 L64 52 l18 20 H68 L54 56 l-16 16 z' fill='%23FBF8F3'/></svg>">
</head>
<body data-page="checkout.html">
<div id="chrome-top"></div>

<main id="main">
  <div class="wrap">
    <div style="padding:30px 0 0">
      <div class="mono">Step two of three</div>
      <h1 style="font-size:clamp(28px,4vw,42px); letter-spacing:-.02em; margin-top:10px">Details &amp; payment</h1>
    </div>

    <div class="steps">
      <span class="step done"><b><i class="fa-solid fa-check" style="font-size:10px"></i></b> Basket</span><span class="step-sep"></span>
      <span class="step on"><b>2</b> Details &amp; payment</span><span class="step-sep"></span>
      <span class="step"><b>3</b> Confirmation</span>
    </div>

    <div id="wrap"></div>
  </div>
</main>

<div id="chrome-foot"></div>

<script src="catalog.js"></script>
<script src="store.js"></script>
<script src="chrome.js"></script>
<script>
(function(){
  'use strict';

  var t = Store.totals();
  var wrap = document.getElementById('wrap');

  if (!t.lines.length){
    wrap.innerHTML =
      '<div class="empty"><h3>There is nothing to pay for</h3>' +
      '<p>Your basket is empty.</p>' +
      '<p style="margin-top:18px"><a class="btn btn-primary" href="shop.html">Go to the shop</a></p></div>';
    return;
  }

  var saved = Store.getUser() || {};

  wrap.innerHTML =
    '<div class="cart">' +
      '<div>' +
        '<div class="note test" style="margin-bottom:20px">' +
          '<i class="fa-solid fa-flask"></i>' +
          '<div><strong>Test mode.</strong> This is a demonstration store. No card is charged, ' +
          'no money moves, and no order is dispatched. The flow, the maths and the ' +
          'invoice are real; only the payment is simulated.</div>' +
        '</div>' +

        '<form id="payForm" novalidate>' +
          '<div class="panel" style="margin-bottom:18px">' +
            '<h3>Where it is going</h3>' +
            '<div class="row2">' +
              '<div class="field"><label for="cName">Full name</label>' +
                '<input id="cName" name="name" autocomplete="name" required value="' + (saved.name || '') + '"><span class="err" hidden></span></div>' +
              '<div class="field"><label for="cPhone">Phone</label>' +
                '<input id="cPhone" name="phone" type="tel" autocomplete="tel" required value="' + (saved.phone || '') + '"><span class="err" hidden></span></div>' +
            '</div>' +
            '<div class="field"><label for="cEmail">Email — the invoice goes here</label>' +
              '<input id="cEmail" name="email" type="email" autocomplete="email" required value="' + (saved.email || '') + '"><span class="err" hidden></span></div>' +
            '<div class="field"><label for="cAddr">Address</label>' +
              '<textarea id="cAddr" name="address" rows="3" autocomplete="street-address" required>' + (saved.address || '') + '</textarea><span class="err" hidden></span></div>' +
            '<div class="row2">' +
              '<div class="field"><label for="cCity">City</label>' +
                '<input id="cCity" name="city" autocomplete="address-level2" required value="' + (saved.city || '') + '"><span class="err" hidden></span></div>' +
              '<div class="field"><label for="cPin">PIN code</label>' +
                '<input id="cPin" name="pin" inputmode="numeric" autocomplete="postal-code" required value="' + (saved.pin || '') + '"><span class="err" hidden></span></div>' +
            '</div>' +
          '</div>' +

          '<div class="panel">' +
            '<h3>How you would like to pay</h3>' +
            '<div class="opt-row" id="methods" role="group" aria-label="Payment method">' +
              '<button type="button" class="opt-btn" data-m="UPI" aria-pressed="true"><i class="fa-solid fa-indian-rupee-sign"></i> UPI</button>' +
              '<button type="button" class="opt-btn" data-m="Card" aria-pressed="false"><i class="fa-regular fa-credit-card"></i> Card</button>' +
              '<button type="button" class="opt-btn" data-m="Netbanking" aria-pressed="false"><i class="fa-solid fa-building-columns"></i> Netbanking</button>' +
            '</div>' +
            '<p class="mono" style="margin-top:16px; text-transform:none; letter-spacing:.02em; font-size:11.5px">' +
              'On the live store this opens Razorpay. The signature it returns is verified ' +
              'by the Cloudflare Worker, never in this browser — see commerce/README.md.</p>' +
          '</div>' +
        '</form>' +
      '</div>' +

      '<aside>' +
        '<div class="panel">' +
          '<h3>Order summary</h3>' +
          t.lines.map(function(l){
            return '<div class="sum"><span>' + l.qty + ' × ' + l.product.name + '</span>' +
                   '<span>' + Store.rupees(l.gross) + '</span></div>';
          }).join('') +
          '<div class="sum muted" style="border-top:1px solid var(--line); margin-top:8px; padding-top:10px">' +
            '<span>Before tax</span><span>' + Store.rupees(t.base) + '</span></div>' +
          Object.keys(t.byRate).sort().map(function(r){
            return '<div class="sum muted"><span>GST at ' + r + '%</span><span>' + Store.rupees(t.byRate[r]) + '</span></div>';
          }).join('') +
          '<div class="sum"><span>Delivery</span><span>' + (t.shipping === 0 ? 'Free' : Store.rupees(t.shipping)) + '</span></div>' +
          '<div class="sum total"><span>To pay</span><span>' + Store.rupees(t.total) + '</span></div>' +
          '<button class="btn btn-primary btn-block" id="payBtn" style="margin-top:18px">' +
            '<i class="fa-solid fa-lock"></i> Pay ' + Store.rupees(t.total) + '</button>' +
          '<a class="btn btn-ghost btn-block" href="cart.html" style="margin-top:10px">Back to basket</a>' +
        '</div>' +
      '</aside>' +
    '</div>';

  var method = 'UPI';
  document.querySelectorAll('#methods .opt-btn').forEach(function(b){
    b.addEventListener('click', function(){
      method = b.getAttribute('data-m');
      document.querySelectorAll('#methods .opt-btn').forEach(function(o){
        o.setAttribute('aria-pressed', String(o === b));
      });
    });
  });

  /* Validation is per-field with a message attached to the field, not one
     alert listing everything wrong. A customer fixing an address should not
     have to hold a list in their head. */
  var RULES = {
    cName:  { test: function(v){ return v.trim().length >= 2; }, msg: 'We need a name for the parcel' },
    cPhone: { test: function(v){ return /^[+ 0-9-]{10,15}$/.test(v.trim()); }, msg: 'A ten-digit mobile number' },
    cEmail: { test: function(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()); }, msg: 'The invoice needs a valid email' },
    cAddr:  { test: function(v){ return v.trim().length >= 10; }, msg: 'A full address, please' },
    cCity:  { test: function(v){ return v.trim().length >= 2; }, msg: 'Which city?' },
    cPin:   { test: function(v){ return /^[1-9][0-9]{5}$/.test(v.trim()); }, msg: 'An Indian PIN code is six digits' }
  };

  function validate(showAll){
    var ok = true, firstBad = null;
    Object.keys(RULES).forEach(function(id){
      var input = document.getElementById(id);
      var field = input.closest('.field');
      var err = field.querySelector('.err');
      var good = RULES[id].test(input.value);
      if (!good){
        ok = false;
        if (!firstBad) firstBad = input;
        if (showAll || input.dataset.touched){
          field.classList.add('bad'); err.textContent = RULES[id].msg; err.hidden = false;
        }
      } else {
        field.classList.remove('bad'); err.hidden = true;
      }
    });
    return { ok: ok, firstBad: firstBad };
  }

  Object.keys(RULES).forEach(function(id){
    var input = document.getElementById(id);
    input.addEventListener('blur', function(){ input.dataset.touched = '1'; validate(false); });
    input.addEventListener('input', function(){ if (input.dataset.touched) validate(false); });
  });

  document.getElementById('payBtn').addEventListener('click', function(){
    var v = validate(true);
    if (!v.ok){
      v.firstBad.focus();
      v.firstBad.scrollIntoView({ block: 'center', behavior: 'smooth' });
      window.toast('Some details still need filling in', 'fa-triangle-exclamation');
      return;
    }

    var details = {
      name: document.getElementById('cName').value.trim(),
      phone: document.getElementById('cPhone').value.trim(),
      email: document.getElementById('cEmail').value.trim(),
      address: document.getElementById('cAddr').value.trim(),
      city: document.getElementById('cCity').value.trim(),
      pin: document.getElementById('cPin').value.trim()
    };
    // Remembered so a second order does not mean typing it all again.
    Store.setUser(details);

    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Talking to the bank…';

    Store.pay(details).then(function(payment){
      payment.method = payment.simulated ? method + ' (simulated)' : payment.method;
      var order = Store.placeOrder(details, payment);
      if (!order) throw new Error('order could not be created');
      location.href = 'order.html?ref=' + encodeURIComponent(order.ref);
    }).catch(function(err){
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-lock"></i> Pay ' + Store.rupees(t.total);
      window.toast(err && err.message === 'cancelled' ? 'Payment cancelled' : 'That payment did not go through',
                   'fa-circle-xmark');
    });
  });
})();
</script>
</body>
</html>
