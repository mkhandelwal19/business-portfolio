<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Your orders — Kaarigar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="store.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23B4552F'/><path d='M28 72 V34 h10 v14 l16-14 h14 L64 52 l18 20 H68 L54 56 l-16 16 z' fill='%23FBF8F3'/></svg>">
</head>
<body data-page="account.html">
<div id="chrome-top"></div>

<main id="main">
  <div class="wrap">
    <div style="padding:30px 0 6px">
      <div class="mono">Your account</div>
      <h1 style="font-size:clamp(28px,4vw,42px); letter-spacing:-.02em; margin-top:10px">Orders</h1>
    </div>

    <div class="note" style="margin:18px 0 26px">
      <i class="fa-solid fa-circle-info"></i>
      <div>In this demo, orders and saved details live in <strong>this browser only</strong>.
      On the live store they sit in Supabase against a real login, so they follow you between
      your phone and your laptop.</div>
    </div>

    <div id="wrap"></div>
  </div>
</main>

<div id="chrome-foot"></div>

<script src="catalog.js"></script>
<script src="store.js"></script>
<script src="chrome.js"></script>
<script>
(function(){
  'use strict';
  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  function render(){
    var orders = Store.orders();
    var user = Store.getUser();
    var wrap = document.getElementById('wrap');

    var profile = user
      ? '<div class="panel" style="margin-bottom:24px">' +
          '<h3>Saved details</h3>' +
          '<p style="color:var(--ink-2)">' + esc(user.name) + ' · ' + esc(user.email) + ' · ' + esc(user.phone) + '<br>' +
            esc(user.address).replace(/\n/g,'<br>') + '<br>' + esc(user.city) + ' ' + esc(user.pin) + '</p>' +
          '<button class="btn btn-ghost btn-sm" id="forget" style="margin-top:14px">Forget these details</button>' +
        '</div>'
      : '';

    if (!orders.length){
      wrap.innerHTML = profile +
        '<div class="empty"><h3>No orders yet</h3>' +
        '<p>When you place one it will appear here with its invoice.</p>' +
        '<p style="margin-top:18px"><a class="btn btn-primary" href="shop.html">Go to the shop</a></p></div>';
      bind();
      return;
    }

    wrap.innerHTML = profile + orders.map(function(o){
      var when = new Date(o.placedAt);
      return '<div class="panel" style="margin-bottom:16px">' +
        '<div style="display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:baseline">' +
          '<div>' +
            '<div class="mono">' + esc(o.ref) + '</div>' +
            '<h3 style="margin:6px 0 0">' + Store.rupees(o.total) + '</h3>' +
            '<div style="color:var(--muted); font-size:13.5px; margin-top:4px">' +
              when.toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' }) +
              ' · ' + o.items.reduce(function(n,i){ return n + i.qty; }, 0) + ' items' +
            '</div>' +
          '</div>' +
          '<span class="pill ok">' + esc(o.status) + '</span>' +
        '</div>' +

        '<div style="display:flex; gap:10px; margin:16px 0; flex-wrap:wrap">' +
          o.items.map(function(i){
            return '<img src="' + CATALOG.img(i.photo, 'xs') + '" alt="' + esc(i.name) + '" ' +
                   'title="' + esc(i.name) + '" loading="lazy" decoding="async" ' +
                   'style="width:52px; height:52px; border-radius:8px; object-fit:cover; border:1px solid var(--line)">';
          }).join('') +
        '</div>' +

        '<div style="display:flex; gap:10px; flex-wrap:wrap">' +
          '<a class="btn btn-ghost btn-sm" href="order.html?ref=' + encodeURIComponent(o.ref) + '">View invoice</a>' +
          '<button class="btn btn-ghost btn-sm" data-reorder="' + esc(o.ref) + '">Order again</button>' +
        '</div>' +
      '</div>';
    }).join('');

    bind();
  }

  function bind(){
    var f = document.getElementById('forget');
    if (f) f.addEventListener('click', function(){
      Store.signOut();
      window.toast('Saved details cleared', 'fa-eraser');
      render();
    });

    document.querySelectorAll('[data-reorder]').forEach(function(b){
      b.addEventListener('click', function(){
        var ref = b.getAttribute('data-reorder');
        var o = Store.orders().filter(function(x){ return x.ref === ref; })[0];
        if (!o) return;
        /* Re-order can silently fail on anything that has since sold out, so
           say which ones rather than quietly dropping them from the basket. */
        var missed = [];
        o.items.forEach(function(i){
          var variantId = i.sku;
          var p = CATALOG.bySku(i.sku);
          if (!p) { missed.push(i.name); return; }
          var v = p.variants.filter(function(x){ return x.label === i.variant; })[0] || p.variants[0];
          var r = Store.add(i.sku, v.id, i.qty);
          if (!r.ok) missed.push(i.name);
        });
        if (missed.length) window.toast('Added what we could — ' + missed.join(', ') + ' unavailable', 'fa-triangle-exclamation');
        else window.toast('Added back to your basket');
      });
    });
  }

  render();
})();
</script>
</body>
</html>
