name = "netloom-enquiry"
main = "src/index.js"
compatibility_date = "2026-09-05"

# Non-secret configuration. Secrets (SMTP_USER, SMTP_PASS) are set with
# `wrangler secret put` and must never appear in this file.
[vars]
SMTP_HOST       = "smtp.zoho.in"          # India DC. Use smtp.zoho.com on the US DC.
SMTP_PORT       = "465"                   # Implicit TLS. Cloudflare blocks 25, not 465.
MAIL_FROM       = "hello@netloom.in"
MAIL_TO         = "hello@netloom.in"
FROM_NAME       = "Netloom"
ALLOWED_ORIGINS = "https://netloom.in,https://www.netloom.in"

# Observability is off by default on the free plan; turn it on so
# `wrangler tail` and the dashboard show the console.error lines the Worker
# writes when a send fails.
[observability]
enabled = true
