<!--
  email-signature.html — the Zoho Mail signature for hello@netloom.in and its
  aliases. Paste the <table> below into Zoho's signature editor through its
  "Insert HTML" option (see ZOHO_EMAIL_SETUP.md, "Signature").

  Rules, because email clients are not browsers:
  - Table layout, every style inline, no <style> block, no classes. Gmail,
    Outlook and the Zoho app all keep inline styles and drop everything else.
  - The logo is the hosted raster at https://netloom.in/assets/email-logo.png,
    the same file the enquiry mails use. Regenerate it with
    `node build-email-logo.js`; every past and future mail then updates.
    It is 240px square and drawn at 56px, so it stays sharp on phones.
  - Fonts, colours and the tagline match worker/preview/*.html so a signature
    and an enquiry mail in the same inbox look like the same company.
  - Keep it short. A signature taller than the reply it sits under is noise.
-->
